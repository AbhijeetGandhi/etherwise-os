<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Etherwise Cockpit</title>

  <!-- Theme BEFORE first paint. A module script is deferred, so it always
       flashes; these four lines are the only logic allowed in the shell.
       app.js owns every subsequent change. -->
  <script>
    (function () {
      var t = localStorage.getItem("ew_cockpit_theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>

<div class="app" id="app" data-nav="expanded">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark" aria-hidden="true">E</span>
      <span class="txt">Etherwise <span class="sub">cockpit</span></span>
    </div>
    <nav class="navlist" id="navlist" aria-label="Sections"></nav>
    <div class="sidebar-foot">
      <div class="envline" id="envline"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button id="navToggle" class="btn-icon ghost" type="button"
              aria-label="Collapse sidebar" title="Collapse sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
             class="ico"><use href="#i-panel-left"/></svg>
      </button>
      <span class="spacer"></span>
      <!-- A section renders once and never again on its own (no polling: this
           is a local single-user tool). So the age of the read is stated, and
           this button is the one thing that makes it new. app.js owns both. -->
      <span id="stale" class="staleline">loading…</span>
      <button id="reloadBtn" class="btn-icon ghost" type="button"
              aria-label="Refresh this view (r)" title="Refresh this view (r)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
             class="ico"><use href="#i-refresh-cw"/></svg>
      </button>
      <span id="health" class="healthchip" title="finance-doctor + last sync"><span class="dot2"></span>…</span>
      <button id="themeToggle" class="btn-icon ghost" type="button"
              aria-label="Toggle theme" title="Toggle theme"></button>
    </header>

    <main id="view" class="view" role="main"></main>
  </div>
</div>

<!-- Chart.js, vendored. Classic script: window.Chart is up before any module. -->
<script src="/static/vendor/chart.umd.js"></script>
<!-- funnel.js stays UMD (node require()s it in tests/test_pipeline_funnel.py) -->
<script src="/static/js/funnel.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
